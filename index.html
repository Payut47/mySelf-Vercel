<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151b63" />
    <meta name="description" content="Payut47 — creator links" />
    <title>Payut47 | Links</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #fff;
        font-family: "Space Grotesk", system-ui, sans-serif;
        background:
          radial-gradient(circle at 14% 18%, rgba(59, 130, 246, .86), transparent 30%),
          radial-gradient(circle at 83% 75%, rgba(239, 68, 68, .83), transparent 35%),
          linear-gradient(130deg, #071a56 0%, #182975 47%, #631c48 100%);
      }
      body::before, body::after {
        content: "";
        position: fixed;
        width: 48vmax;
        height: 48vmax;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 50%;
        pointer-events: none;
      }
      body::before { top: -28vmax; left: -18vmax; }
      body::after { right: -27vmax; bottom: -31vmax; }
      main { width: min(100% - 32px, 480px); padding: 28px 0; }
      .card {
        position: relative;
        padding: clamp(30px, 7vw, 48px);
        border: 1px solid rgba(255,255,255,.24);
        border-radius: 28px;
        background: rgba(10, 15, 52, .33);
        box-shadow: 0 28px 60px rgba(1, 4, 30, .35);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      .eyebrow { margin: 0 0 14px; color: #b9d5ff; font: 500 12px/1 "DM Mono", monospace; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(46px, 12vw, 64px); line-height: .95; letter-spacing: -.075em; }
      .accent { color: #ff7d7d; }
      .intro { max-width: 32ch; margin: 22px 0 30px; color: rgba(255,255,255,.8); font-size: 17px; line-height: 1.5; }
      .links { display: grid; gap: 12px; }
      .link {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 66px;
        padding: 12px 16px;
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 16px;
        color: #fff;
        background: rgba(255,255,255,.09);
        text-decoration: none;
        transition: transform .2s ease, background .2s ease, border-color .2s ease;
      }
      .link:hover, .link:focus-visible { transform: translateY(-3px); border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.18); outline: none; }
      .icon { display: grid; width: 38px; height: 38px; place-items: center; flex: 0 0 auto; border-radius: 11px; font-weight: 700; }
      .youtube .icon { background: #ff3434; }
      .tiktok .icon { background: #0b0b13; text-shadow: 2px 1px #ff3f67, -2px -1px #41e6e2; }
      .donate .icon { background: linear-gradient(135deg, #1577ff, #e83d62); }
      .copy { flex: 1; font-weight: 600; }
      .arrow { color: rgba(255,255,255,.72); font-size: 23px; line-height: 1; }
      footer { padding: 20px 5px 0; color: rgba(255,255,255,.58); font: 12px "DM Mono", monospace; text-align: center; }
      @media (max-width: 380px) { .card { padding: 29px 22px; } }
      @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="name">
        <p class="eyebrow">Creator · Thailand</p>
        <h1 id="name">Payut<span class="accent">47</span></h1>
        <p class="intro">Find me, watch my videos, or support what I create.</p>
        <nav class="links" aria-label="Payut47 links">
          <a class="link youtube" href="https://www.youtube.com/@PayutTH" target="_blank" rel="noopener noreferrer"><span class="icon">▶</span><span class="copy">YouTube</span><span class="arrow" aria-hidden="true">↗</span></a>
          <a class="link tiktok" href="https://www.tiktok.com/@payut47" target="_blank" rel="noopener noreferrer"><span class="icon">♪</span><span class="copy">TikTok</span><span class="arrow" aria-hidden="true">↗</span></a>
          <a class="link donate" href="https://www.easydonate.app/payut47" target="_blank" rel="noopener noreferrer"><span class="icon">♥</span><span class="copy">Donate</span><span class="arrow" aria-hidden="true">↗</span></a>
        </nav>
      </section>
      <footer>© 2026 PAYUT47</footer>
    </main>
  </body>
</html>
